notes: |
  Stylised rsETH/USDC Morpho Blue stress fixture inspired by the incident
  disclosed on 18 April 2026. The event_ts below is the modelled shock
  timestamp used by the retained hourly path; it is not the incident
  disclosure timestamp. This fixture is not an exact replay of exploit
  flows, protocol losses, or a specific historical Morpho market.

  Public Aave loss estimates evolved materially with recovery assumptions:
  the initial incident report estimated approximately $123.7M-$230.1M,
  while a later recovery scenario estimated approximately $62.4M-$162.5M.
  No single final loss number is used as a calibration target here.

  Sources:
    - Aave governance: rsETH incident — 2026-04-18
      https://governance.aave.com/t/rseth-incident-2026-04-18/24481
    - Aave governance: rsETH Incident Report (April 20, 2026)
      https://governance.aave.com/t/rseth-incident-report-april-20-2026/24580
