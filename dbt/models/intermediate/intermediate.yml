version: 2

models:
  - name: int_morpho__flow_events
    description: >
      Layer 3, intermediate. Long table of the four flow events with a sign convention
      (supply +, withdraw - on the supply ledger; borrow +, repay - on the borrow ledger),
      labelled with the market's loan and collateral symbols. Gross flows only, never a balance.
    columns:
      - name: event_key
        data_tests: [unique, not_null]
      - name: flow_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['supply', 'withdraw', 'borrow', 'repay']
      - name: ledger
        data_tests:
          - accepted_values:
              arguments:
                values: ['supply', 'borrow']
      - name: loan_asset_symbol
        data_tests: [not_null]
      - name: signed_amount_loan_units
        data_tests: [not_null]

  - name: int_morpho__flows_weekly
    description: Weekly gross flows per loan asset and flow type. No cross-asset aggregation.
    columns:
      - name: loan_asset_symbol
        data_tests: [not_null]
      - name: gross_amount_loan_units
        data_tests: [not_null]

  - name: int_morpho__liquidations_daily
    description: Daily liquidation activity per market, amounts labelled with the market's own assets.
    columns:
      - name: market_id
        data_tests: [not_null]
      - name: bad_debt_loan_units
        data_tests: [not_null]

  - name: int_morpho__borrower_activity
    description: Borrower activity concentration per market inside the activity window (top-3 and top-10 shares of borrowed amounts).
    columns:
      - name: market_id
        data_tests: [unique, not_null]
      - name: top3_share
        data_tests:
          - not_null
          - bounds:
              arguments:
                lower: 0
                upper: 1
      - name: top10_share
        data_tests:
          - not_null
          - bounds:
              arguments:
                lower: 0
                upper: 1

  - name: int_morpho__market_state_pinned
    description: Latest cached state per market at or before the publication block (var state_block).
    columns:
      - name: market_id
        data_tests: [unique, not_null]
      - name: cached_state_block
        data_tests: [not_null]

unit_tests:
  - name: flow_sign_convention
    description: Supply and borrow are positive, withdraw and repay negative, each on its ledger; amounts pass through untouched.
    model: int_morpho__flow_events
    given:
      - input: ref('stg_morpho__markets')
        rows:
          - {market_id: '0xaaa', loan_asset_symbol: 'USDC', collateral_asset_symbol: 'WBTC', market_label: 'WBTC/USDC'}
      - input: ref('stg_morpho__events_supply')
        rows:
          - {event_key: 't1-0', market_id: '0xaaa', block_number: 1, block_ts: '2026-01-05 00:00:00', tx_hash: 't1', log_index: 0, on_behalf: '0xb', assets: 100.0, shares: 100.0}
      - input: ref('stg_morpho__events_withdraw')
        rows:
          - {event_key: 't2-0', market_id: '0xaaa', block_number: 2, block_ts: '2026-01-05 00:01:00', tx_hash: 't2', log_index: 0, on_behalf: '0xb', assets: 40.0, shares: 40.0}
      - input: ref('stg_morpho__events_borrow')
        rows:
          - {event_key: 't3-0', market_id: '0xaaa', block_number: 3, block_ts: '2026-01-05 00:02:00', tx_hash: 't3', log_index: 0, on_behalf: '0xc', assets: 30.0, shares: 30.0}
      - input: ref('stg_morpho__events_repay')
        rows:
          - {event_key: 't4-0', market_id: '0xaaa', block_number: 4, block_ts: '2026-01-05 00:03:00', tx_hash: 't4', log_index: 0, on_behalf: '0xc', assets: 10.0, shares: 10.0}
      - input: ref('roster_markets')
        rows:
          - {market_id: '0xaaa', roster_rank: 1}
    expect:
      rows:
        - {event_key: 't1-0', flow_type: 'supply',   ledger: 'supply', flow_sign: 1,  amount_loan_units: 100.0, signed_amount_loan_units: 100.0}
        - {event_key: 't2-0', flow_type: 'withdraw', ledger: 'supply', flow_sign: -1, amount_loan_units: 40.0,  signed_amount_loan_units: -40.0}
        - {event_key: 't3-0', flow_type: 'borrow',   ledger: 'borrow', flow_sign: 1,  amount_loan_units: 30.0,  signed_amount_loan_units: 30.0}
        - {event_key: 't4-0', flow_type: 'repay',    ledger: 'borrow', flow_sign: -1, amount_loan_units: 10.0,  signed_amount_loan_units: -10.0}

  - name: borrower_share_is_exactly_one_when_every_borrower_is_in_the_top_n
    description: >
      Three borrowers whose amounts do not add up exactly in floating point. top3_share and
      top10_share must be exactly 1: numerators and denominator are summed over the same rows.
      On the real cache, a window total summed in another order gave 1.0000000000000002.
    model: int_morpho__borrower_activity
    given:
      - input: ref('stg_morpho__events_borrow')
        rows:
          - {market_id: '0xaaa', block_ts: '2026-06-20 00:00:00', on_behalf: '0xb1', assets: 0.1}
          - {market_id: '0xaaa', block_ts: '2026-06-20 00:01:00', on_behalf: '0xb2', assets: 0.2}
          - {market_id: '0xaaa', block_ts: '2026-06-20 00:02:00', on_behalf: '0xb3', assets: 0.3}
      - input: ref('stg_morpho__markets')
        rows:
          - {market_id: '0xaaa', loan_asset_symbol: 'USDC', market_label: 'WBTC/USDC'}
      - input: ref('roster_markets')
        rows:
          - {market_id: '0xaaa', roster_rank: 1}
    expect:
      rows:
        - {market_id: '0xaaa', n_active_borrowers: 3, top3_share: 1.0, top10_share: 1.0}
